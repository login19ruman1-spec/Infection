name: Build Infection

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Infection-Paper-1.21.4
          path: target/Infection-2.0.0.jar
          if-no-files-found: error
