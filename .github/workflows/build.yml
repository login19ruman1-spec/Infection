name: Build Infection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Infection-Paper-1.21.4
          path: target/Infection-1.0.0.jar
          if-no-files-found: error
